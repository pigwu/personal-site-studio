<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="description" content="A personal website built with Personal Site Studio">
  <title>Personal Site</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="memory-map.css">
</head>
<body>
  <div class="page-grid" aria-hidden="true"></div>
  <header class="site-header">
    <a class="identity" href="#top"><span id="identity-mark">PS</span><strong id="identity-name"></strong></a>
    <nav id="site-nav" aria-label="Main navigation"></nav>
    <a class="contact-pill" id="email-link" href="mailto:hello@example.com">Say hello</a>
  </header>

  <main id="top">
    <section class="hero section-canvas" data-section="hero">
      <div class="shell hero-layout">
        <div class="hero-copy">
          <p class="eyebrow" id="hero-role" data-edit-path="profile.role"></p>
          <h1 id="hero-name" data-edit-path="profile.name"></h1>
          <p class="hero-tagline" id="hero-tagline" data-edit-path="site.tagline"></p>
          <div class="hero-links" id="hero-links"></div>
        </div>
        <figure class="portrait-frame">
          <img id="profile-avatar" alt="Profile portrait">
          <figcaption><span id="profile-institution" data-edit-path="profile.institution"></span> / <span id="profile-location" data-edit-path="profile.location"></span></figcaption>
        </figure>
      </div>
    </section>

    <section class="section section-canvas" id="about" data-section="about">
      <div class="shell">
        <div class="section-label"><span>01</span><p id="about-eyebrow" data-edit-path="about.eyebrow"></p></div>
        <div class="about-layout">
          <h2 id="about-heading" data-edit-path="about.heading"></h2>
          <div><div id="about-paragraphs"></div><div class="highlights" id="about-highlights"></div></div>
        </div>
      </div>
    </section>

    <section class="section work-section section-canvas" id="work" data-section="work">
      <div class="shell">
        <div class="section-label"><span>02</span><p id="work-eyebrow" data-edit-path="sectionCopy.workEyebrow"></p></div>
        <div class="section-intro"><h2 id="work-heading" data-edit-path="sectionCopy.workHeading"></h2><p id="work-description" data-edit-path="sectionCopy.workDescription"></p></div>
        <div class="project-grid" id="project-grid"></div>
      </div>
    </section>

    <section class="section section-canvas" id="interest" data-section="interest">
      <div class="shell">
        <div class="section-label"><span>03</span><p id="interest-kicker" data-edit-path="interest.kicker"></p></div>
        <div class="interest-head"><div><p class="interest-name" id="interest-name" data-edit-path="interest.name"></p><h2 id="interest-headline" data-edit-path="interest.headline"></h2><p id="interest-description" data-edit-path="interest.description"></p></div><div class="stat-grid" id="interest-stats"></div></div>
        <div class="interest-grid" id="interest-grid"></div>
      </div>
    </section>

    <section class="section memory-section section-canvas" id="memory" data-section="memory">
      <div class="shell">
        <div class="section-label"><span>04</span><p id="memory-eyebrow" data-edit-path="memory.eyebrow"></p></div>
        <div class="memory-intro">
          <div><h2 id="memory-heading" data-edit-path="memory.title"></h2><p id="memory-description" data-edit-path="memory.description"></p></div>
          <div class="memory-style-badge"><span>MAP STYLE</span><strong id="memory-style-name"></strong></div>
        </div>
        <div class="memory-map" id="memory-map" data-memory-style="expedition">
          <svg class="memory-route" aria-hidden="true"><path></path></svg>
          <div class="memory-days" id="memory-days"></div>
        </div>
      </div>
    </section>

    <section class="section blog-section section-canvas" id="blog" data-section="blog">
      <div class="shell">
        <div class="section-label"><span>05</span><p id="blog-eyebrow" data-edit-path="sectionCopy.blogEyebrow"></p></div>
        <div class="section-intro"><h2 id="blog-heading" data-edit-path="sectionCopy.blogHeading"></h2><p id="blog-description" data-edit-path="sectionCopy.blogDescription"></p></div>
        <div class="post-list" id="post-list"></div>
      </div>
    </section>
  </main>

  <dialog id="post-dialog"><button class="dialog-close" aria-label="Close">x</button><article id="post-detail"></article></dialog>
  <dialog id="memory-dialog" class="memory-dialog"><button class="dialog-close memory-dialog-close" aria-label="Close">x</button><article id="memory-detail"></article></dialog>
  <footer class="site-footer shell"><div><strong id="footer-name"></strong><p id="footer-tagline"></p></div><p>Built with Personal Site Studio · <span id="year"></span></p></footer>
  <script src="app.js"></script>
</body>
</html>
